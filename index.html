<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MEMED</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 30%, #2a1b4a, #0d0818 70%);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; overflow: hidden; user-select: none; -webkit-user-select: none;
    padding: 20px;
  }
  .label { font-size: 15px; letter-spacing: 3px; opacity: .7; text-transform: uppercase; }
  #score { font-size: 84px; font-weight: 900; line-height: 1; text-shadow: 0 0 24px #b26bff; }
  #btn {
    width: 220px; height: 220px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff7ad9, #d4145a 60%, #8a0b3a);
    color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 12px 0 #5c0727, 0 20px 40px rgba(0,0,0,.6), inset 0 -8px 20px rgba(0,0,0,.25);
    transition: transform .05s, box-shadow .05s; touch-action: manipulation;
  }
  #btn:active, #btn.pressed { transform: translateY(10px); box-shadow: 0 2px 0 #5c0727, 0 8px 20px rgba(0,0,0,.6), inset 0 -8px 20px rgba(0,0,0,.25); }
  .bar { width: min(320px, 85vw); height: 16px; background: #ffffff1a; border-radius: 99px; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd23f, #ff3d3d); transition: width .1s; }
  #next { font-size: 14px; opacity: .8; }
  #bass {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; color: #ffe600; pointer-events: none; opacity: 0;
    text-shadow: 0 0 30px #ff0000, 4px 4px 0 #ff0000;
  }
  body.boom { animation: shake .08s infinite; }
  body.boom #bass { opacity: 1; animation: pulse .2s infinite alternate; }
  body.boom::before { content: ""; position: fixed; inset: 0; background: #ff000030; pointer-events: none; }
  @keyframes shake {
    0% { transform: translate(0,0); } 25% { transform: translate(-8px,5px); }
    50% { transform: translate(7px,-6px); } 75% { transform: translate(-5px,-4px); } 100% { transform: translate(6px,7px); }
  }
  @keyframes pulse { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.25) rotate(4deg); } }
  .pop { position: fixed; font-weight: 900; font-size: 26px; color: #ffd23f; pointer-events: none; animation: up .7s ease-out forwards; }
  @keyframes up { to { transform: translateY(-80px); opacity: 0; } }
  #reset { background: none; border: 1px solid #ffffff40; color: #fff; padding: 8px 18px; border-radius: 99px; font-size: 14px; opacity: .7; }
</style>
</head>

let ctx = null, buffer = null, score = 0;
let best = 0;
try { score = parseInt(localStorage.getItem("memedScore") || "0", 10) || 0; } catch (e) {}

const scoreEl = document.getElementById("score");
const fillEl = document.getElementById("fill");
const nextEl = document.getElementById("next");
const btn = document.getElementById("btn");

function render() {
  scoreEl.textContent = score;
  const r = score % 50;
  fillEl.style.width = (r / 50 * 100) + "%";
  nextEl.textContent = "Bass'a " + (50 - r) + " tık kaldı";
}
render();

async function init() {
  const bin = atob(AUDIO_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  buffer = await new Promise((res, rej) => ctx.decodeAudioData(bytes.buffer, res, rej));
}

function playNormal() {
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const g = ctx.createGain(); g.gain.value = 0.9;
  src.connect(g).connect(ctx.destination);
  src.start();
}

function distortionCurve(amount) {
  const n = 44100, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i * 2 / n - 1;
    curve[i] = (3 + amount) * x * 20 * Math.PI / 180 / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

function playBass() {
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = 0.85; // biraz daha kalın
  const pre = ctx.createGain(); pre.gain.value = 3;
  const low = ctx.createBiquadFilter(); low.type = "lowshelf"; low.frequency.value = 150; low.gain.value = 30;
  const sub = ctx.createBiquadFilter(); sub.type = "peaking"; sub.frequency.value = 60; sub.Q.value = 1; sub.gain.value = 20;
  const dist = ctx.createWaveShaper(); dist.curve = distortionCurve(400); dist.oversample = "4x";
  const post = ctx.createGain(); post.gain.value = 1.6;
  src.connect(pre).connect(low).connect(sub).connect(dist).connect(post).connect(ctx.destination);
  src.start();
  document.body.classList.add("boom");
  if (navigator.vibrate) { try { navigator.vibrate([200, 80, 300]); } catch (e) {} }
  const dur = (buffer.duration / src.playbackRate.value) * 1000;
  setTimeout(() => document.body.classList.remove("boom"), Math.max(dur, 800));
}

function pop(x, y) {
  const p = document.createElement("div");
  p.className = "pop"; p.textContent = "+1";
  p.style.left = (x - 15 + (Math.random() * 40 - 20)) + "px";
  p.style.top = (y - 30) + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 700);
}

// Normal ses: düz <audio> ile (telefonlarda en güvenilir yol)
const AUDIO_URL = "data:audio/mpeg;base64," + AUDIO_B64;
const pool = [];
for (let i = 0; i < 6; i++) { const a = new Audio(AUDIO_URL); a.preload = "auto"; pool.push(a); }
let poolIdx = 0;
function playElement() {
  const a = pool[poolIdx]; poolIdx = (poolIdx + 1) % pool.length;
  try { a.pause(); a.currentTime = 0; } catch (e) {}
  const p = a.play();
  if (p && p.catch) p.catch(() => { nextEl.textContent = "Ses çalmadı, telefonun sessizde mi?"; });
}

function unlockCtx() {
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      init().catch(() => {});
    }
    if (ctx.state === "suspended") ctx.resume();
  } catch (e) {}
}

function audioReady() { return buffer && ctx && ctx.state === "running"; }

function hit(x, y) {
  score++;
  try { localStorage.setItem("memedScore", score); } catch (e) {}
  render();
  pop(x || innerWidth / 2, y || innerHeight / 2);
  if (audioReady()) {
    // Web Audio: her basış ayrı ses, üst üste binebilir, hızlı basınca kaybolmaz
    if (score % 50 === 0) playBass(); else playNormal();
  } else {
    playElement();
  }
}

// Ses motoru hazırsa basar basmaz (pointerdown) çal; değilse ilk dokunuşlar click ile açılır
let handledByPointer = false;
btn.addEventListener("pointerdown", (e) => {
  btn.classList.add("pressed");
  if (audioReady()) { handledByPointer = true; hit(e.clientX, e.clientY); }
  else handledByPointer = false;
});
btn.addEventListener("click", (e) => {
  unlockCtx();
  if (handledByPointer) { handledByPointer = false; return; }
  hit(e.clientX, e.clientY);
});
btn.addEventListener("dblclick", (e) => e.preventDefault());
["pointerup", "pointerleave", "pointercancel"].forEach(t => btn.addEventListener(t, () => btn.classList.remove("pressed")));

document.getElementById("reset").addEventListener("click", () => {
  score = 0;
  try { localStorage.setItem("memedScore", 0); } catch (e) {}
  render();
});
</script>
</body>
</html>
